<title>NBA Tonight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a coach's clipboard. Hardboard backing, metal clip, a dry-erase sheet with a half court
   drawn on it. Services sit on the sheet; each opens into TV-style score bugs. One deliberate look. */
:root {
  color-scheme: light;
  --board: #a8774a;          /* hardboard backing */
  --board-dark: #8a5f38;
  --sheet: #fbfbf7;          /* dry-erase sheet */
  --ink: #17202c;            /* marker black */
  --muted: #5c6675;
  --line: #e1e4e8;
  --court: #c7d2de;          /* faint printed court lines */
  --marker-red: #c8372d;
  --marker-blue: #2d5fc8;
  --bug: #10151d;            /* score bug */
  --bug-2: #1b2330;
  --bug-fg: #f4f6fa;
  --bug-muted: #9aa5b6;
  --live: #e23b3b;
  --prime: #0a7fd9;
  --peacock: #6d4ae0;
  --espn: #d42a2a;
  --lp: #1d4f9c;
  --hand: "Permanent Marker", "Comic Sans MS", cursive;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html { background: var(--board); }
body {
  background-color: var(--board);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.08), transparent 40%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 5px);
  color: var(--ink); font-family: var(--body); font-size: 16px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 34px 28px;
  min-height: 100%;
}
.sheet {
  position: relative; max-width: 540px; margin: 0 auto;
  background: var(--sheet); border-radius: 10px;
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 10px 30px rgba(40,20,0,.35), 0 2px 4px rgba(40,20,0,.25);
  padding: 58px 16px 22px; isolation: isolate;
}
/* metal clip */
.clip {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  width: 150px; height: 58px; z-index: 3; pointer-events: none;
}
.clip .plate {
  position: absolute; inset: 14px 0 0; border-radius: 10px 10px 16px 16px;
  background: linear-gradient(180deg, #eef1f4, #b9c0c8 45%, #8d959e 55%, #c9cfd5);
  box-shadow: 0 3px 6px rgba(0,0,0,.35), 0 1px 0 #fff inset;
}
.clip .ring {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: 54px; height: 30px; border: 6px solid #9aa2ab; border-bottom: none; border-radius: 30px 30px 0 0;
  box-shadow: 0 -1px 0 #e3e7eb inset;
}
.clip .rivet { position: absolute; top: 34px; width: 10px; height: 10px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff, #8d959e 70%); }
.clip .rivet.l { left: 22px; } .clip .rivet.r { right: 22px; }
/* court drawn on the sheet */
.court { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }

header { text-align: center; display: grid; gap: 2px; transition: filter .25s, opacity .25s; }
header h1 {
  font-family: var(--hand); font-weight: 400; font-size: 2.5rem; line-height: 1.05; margin: 0;
  color: var(--ink); letter-spacing: .01em; text-wrap: balance;
}
header p { margin: 0; color: var(--muted); font-size: .95rem; }
header p b { color: var(--marker-red); font-weight: 600; }

.services { display: grid; gap: 12px; margin-top: 20px; }
.svc {
  background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(23,32,44,.06);
  transition: filter .25s, opacity .25s, transform .25s;
}
.svc > button.head {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
  display: grid; grid-template-columns: 6px 1fr auto auto; align-items: center; gap: 14px;
  padding: 14px 16px 14px 0; min-height: 70px;
}
.svc > button.head:focus-visible { outline: 3px solid var(--c); outline-offset: -3px; border-radius: 14px; }
.bar { align-self: stretch; background: var(--c); }
.name { font-family: var(--display); font-weight: 800; font-size: 1.55rem; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.count { font-family: var(--display); font-weight: 800; font-size: 1.1rem; color: #fff; background: var(--c);
  border-radius: 999px; padding: 3px 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
.svc.open .chev { transform: rotate(180deg); }
.games[hidden] { display: none; }
.games { border-top: 1px solid var(--line); padding: 14px 12px 12px; display: grid; gap: 12px; background: #f6f7f9; }
.note { color: var(--muted); font-size: .78rem; line-height: 1.45; text-align: center; }

/* focus mode: one service open, the rest of the clipboard goes soft */
.focus header, .focus footer, .focus .svc:not(.open) { filter: blur(3px); opacity: .45; }
.focus .svc:not(.open):hover { opacity: .65; }

/* score bug */
.game { display: grid; }
.bug {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 1fr auto; border-radius: 10px; overflow: hidden;
  background: var(--bug); color: var(--bug-fg);
  box-shadow: 0 4px 10px rgba(16,21,29,.25);
}
.bug:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; min-height: 50px; }
.row + .row { border-top: 1px solid rgba(255,255,255,.07); }
.abbr {
  align-self: stretch; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .04em;
  background: var(--tc); color: var(--tf);
}
.tname { padding: 6px 10px; min-width: 0; }
.tname b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.tname small { display: block; color: var(--bug-muted); font-size: .72rem; font-variant-numeric: tabular-nums; margin-top: 1px; }
.score { font-family: var(--display); font-weight: 800; font-size: 1.6rem; padding: 0 12px; font-variant-numeric: tabular-nums; }
.score.lead { color: #fff; } .score.trail { color: var(--bug-muted); }
.status {
  display: grid; align-content: center; justify-items: center; gap: 4px; min-width: 84px; padding: 8px 10px;
  background: var(--bug-2); border-left: 1px solid rgba(255,255,255,.07); text-align: center;
}
.status .t { font-family: var(--display); font-weight: 700; font-size: 1.15rem; line-height: 1; white-space: nowrap; }
.status .z { font-size: .62rem; color: var(--bug-muted); letter-spacing: .08em; text-transform: uppercase; }
.pill { font-size: .6rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; border-radius: 4px; padding: 2px 5px; background: rgba(255,255,255,.1); color: var(--bug-muted); white-space: nowrap; }
.pill.live { background: var(--live); color: #fff; display: inline-flex; align-items: center; gap: 4px; }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.foot {
  grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 6px 10px; font-size: .72rem; color: var(--bug-muted); background: rgba(255,255,255,.04);
  border-top: 1px solid rgba(255,255,255,.07);
}
.foot .outs { display: inline-flex; align-items: center; gap: 4px; color: var(--bug-fg); font-weight: 600; }
.foot svg { width: 13px; height: 13px; transition: transform .2s; }
.game.open .foot svg { transform: rotate(180deg); }
.game.done .bug { opacity: .6; }

/* injury pop-out */
.inj[hidden] { display: none; }
.inj {
  margin: -6px 8px 0; padding: 14px 12px 10px; border-radius: 0 0 10px 10px;
  background: #fff; border: 1px solid var(--line); border-top: none;
  display: grid; gap: 8px; font-size: .8rem; line-height: 1.45;
}
.live-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.live-line .pill.live { font-size: .62rem; }
.live-line a { color: var(--marker-blue); font-weight: 600; text-decoration: none; }
.live-line a:hover { text-decoration: underline; }
.live-line .sc { font-family: var(--display); font-weight: 700; font-size: 1rem; }
.inj b { font-weight: 700; }
.inj .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
.inj .who { color: var(--muted); }

.empty { text-align: center; padding: 28px 8px 8px; display: grid; gap: 6px; }
.empty .big { font-family: var(--hand); font-size: 1.6rem; }
.empty p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
.empty strong { color: var(--ink); }

footer { color: rgba(255,255,255,.85); font-size: .76rem; line-height: 1.5; text-align: center; margin-top: 14px; transition: filter .25s, opacity .25s; }
@media (prefers-reduced-motion: reduce) {
  .chev, .foot svg, .svc, header, footer { transition: none; }
  .pill.live::before { animation: none; }
}
@media (max-width: 380px) {
  .row { grid-template-columns: 46px 1fr auto; }
  .status { min-width: 72px; }
  header h1 { font-size: 2.1rem; }
}
</style>

<div class="sheet" id="sheet">
  <div class="clip" aria-hidden="true"><div class="ring"></div><div class="plate"></div><span class="rivet l"></span><span class="rivet r"></span></div>
  <svg class="court" viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g fill="none" stroke="var(--court)" stroke-width="2.5" opacity=".55">
      <rect x="10" y="20" width="380" height="670" rx="6"/>
      <line x1="10" y1="690" x2="390" y2="690"/>
      <rect x="140" y="500" width="120" height="190"/>
      <circle cx="200" cy="500" r="60"/>
      <path d="M40 690 V600 A170 170 0 0 1 360 600 V690"/>
      <circle cx="200" cy="655" r="9"/>
      <line x1="178" y1="668" x2="222" y2="668"/>
      <path d="M140 20 A60 60 0 0 0 260 20"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-width="3" opacity=".22">
      <g stroke="var(--marker-red)"><path d="M70 430 l18 18 M88 430 l-18 18"/><path d="M300 380 l18 18 M318 380 l-18 18"/><path d="M180 300 l18 18 M198 300 l-18 18"/></g>
      <g stroke="var(--marker-blue)"><circle cx="110" cy="560" r="11"/><circle cx="292" cy="540" r="11"/><circle cx="200" cy="440" r="11"/>
        <path d="M120 552 C170 500 230 520 282 535" stroke-dasharray="7 7"/><path d="M276 530 l8 6 -10 3"/></g>
    </g>
  </svg>

  <header>
    <h1>NBA Tonight</h1>
    <p id="date"></p>
  </header>
  <section class="services" id="services"></section>
</div>
<footer id="foot"></footer>

<script>
const DATA = /*DATA*/null;

const SERVICES = [
  { id: "prime", name: "Prime Video", color: "--prime" },
  { id: "peacock", name: "Peacock", color: "--peacock" },
  { id: "espn", name: "ESPN", color: "--espn" },
  { id: "leaguepass", name: "League Pass", color: "--lp",
    note: "Games with your local team are blacked out on League Pass." },
];

const tz = "America/New_York";
const dayKey = d => new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const timeET = iso => new Date(iso).toLocaleTimeString("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" });
const dayLabel = (key, opts) => new Date(key + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...opts });
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const hex = h => /^[0-9a-f]{6}$/i.test(h || "") ? "#" + h : "#333333";
const CHEV = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>`;

const now = new Date();
const today = dayKey(now);
const games = (DATA && DATA.games) || [];
const TEAMS = (DATA && DATA.teams) || {};
const tonight = games.filter(g => g.day === today);

document.getElementById("date").innerHTML =
  esc(dayLabel(today, { weekday: "long", month: "long", day: "numeric" })) + " · " +
  (tonight.length ? `<b>${tonight.length} game${tonight.length === 1 ? "" : "s"}</b> tonight` : "No games tonight");

// Live / final / upcoming, judged from the scheduled tip-off on this device.
function state(g) {
  if (g.state === "post") return "done";
  const start = new Date(g.start).getTime(), t = now.getTime();
  if (t >= start + 3 * 3600e3) return "done";
  if (t >= start) return "live";
  return "pre";
}

// Pick a readable block color for a team: its main color unless too light, then its alternate.
function lum(h) { const n = parseInt(h.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
function teamColors(t) {
  let bg = hex(t.color);
  if (lum(bg) < .012) bg = hex(t.alt) !== "#333333" && lum(hex(t.alt)) > .012 ? hex(t.alt) : "#2b3340"; // near-black blends into the bug
  return { bg, fg: lum(bg) > .45 ? "#10151d" : "#ffffff" };
}

function teamRow(t, other, showScore) {
  const c = teamColors(t);
  const s = Number(t.score), o = Number(other.score);
  const cls = showScore ? (s >= o ? "lead" : "trail") : "";
  return `<div class="row">
    <div class="abbr" style="--tc:${c.bg};--tf:${c.fg}">${esc(t.abbr)}</div>
    <div class="tname"><b>${esc(t.name)}</b>${t.rec ? `<small>${esc(t.rec)}</small>` : ""}</div>
    ${showScore ? `<div class="score ${cls}">${esc(t.score)}</div>` : `<div></div>`}
  </div>`;
}

function injuries(name, t) {
  if (!t) return `<div><b>${esc(name)}</b> <span class="cnt">injury report not available</span></div>`;
  const active = t.roster - t.out.length;
  return `<div><b>${esc(name)}</b> <span class="cnt">${active} of ${t.roster} active</span>
    <div class="who">${t.out.length ? t.out.map(n => esc(n) + " out").join(", ") : "Nobody out"}</div></div>`;
}

let n = 0;
function gameBug(g) {
  const s = state(g), id = "g" + (n++);
  const a = g.a, h = g.h;
  const hasScore = g.state !== "pre" && a.score != null && h.score != null;
  const ta = TEAMS[g.awayId], th = TEAMS[g.homeId];
  const outs = (ta ? ta.out.length : 0) + (th ? th.out.length : 0);
  const pills = [];
  if (g.cup) pills.push(`<span class="pill">NBA Cup</span>`);
  if (g.channel && !["Prime Video", "Peacock"].includes(g.channel)) pills.push(`<span class="pill">${esc(g.channel)}</span>`);
  const statusTop = s === "live" ? `<span class="pill live">Live</span>`
    : s === "done" ? `<span class="t">Final</span>`
    : `<span class="t">${timeET(g.start)}</span><span class="z">ET</span>`;
  const link = g.link && g.link.startsWith("https://") ? g.link : null;
  let liveLine = "";
  if (s === "live") {
    liveLine = `<div class="live-line"><span class="pill live">Live now</span>
      ${hasScore ? `<span class="sc">${esc(a.abbr)} ${esc(a.score)} – ${esc(h.score)} ${esc(h.abbr)}</span>` : ""}
      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Live score on ESPN ↗</a>` : ""}</div>`;
  } else if (s === "done" && link) {
    liveLine = `<div class="live-line"><span class="pill">Final</span><a href="${esc(link)}" target="_blank" rel="noopener">Box score on ESPN ↗</a></div>`;
  }
  return `<div class="game ${s === "done" ? "done" : ""}">
    <button type="button" class="bug" aria-expanded="false" aria-controls="${id}"
      aria-label="${esc(a.name)} at ${esc(h.name)}, ${s === "live" ? "live now" : timeET(g.start)}. Show injuries.">
      <div class="rows">${teamRow(a, h, hasScore)}${teamRow(h, a, hasScore)}</div>
      <div class="status">${statusTop}${pills.join("")}</div>
      <div class="foot"><span>${a.abbr && h.abbr ? esc(a.abbr) + " @ " + esc(h.abbr) : ""}</span>
        <span class="outs">${ta && th ? `${outs} player${outs === 1 ? "" : "s"} out` : "Injury report"} ${CHEV}</span></div>
    </button>
    <div class="inj" id="${id}" hidden>
      ${liveLine}
      ${injuries(a.name, ta)}
      ${injuries(h.name, th)}
    </div>
  </div>`;
}

const sheet = document.getElementById("sheet");
const wrap = document.getElementById("services");
const shown = SERVICES
  .map(svc => ({ svc, list: tonight.filter(g => g.service === svc.id) }))
  .filter(x => x.list.length)
  .sort((x, y) => y.list.length - x.list.length);

function closeAll() {
  wrap.querySelectorAll(".svc.open").forEach(el => {
    el.classList.remove("open");
    el.querySelector(".games").hidden = true;
    el.querySelector(".head").setAttribute("aria-expanded", "false");
  });
  sheet.classList.remove("focus");
  document.body.classList.remove("focus");
}

for (const { svc, list } of shown) {
  const el = document.createElement("div");
  el.className = "svc";
  el.style.setProperty("--c", `var(${svc.color})`);
  el.innerHTML = `
    <button type="button" class="head" id="btn-${svc.id}" aria-expanded="false" aria-controls="list-${svc.id}">
      <span class="bar"></span>
      <span class="name">${svc.name}</span>
      <span class="count">${list.length} game${list.length === 1 ? "" : "s"}</span>
      ${CHEV.replace("<svg", '<svg class="chev"')}
    </button>
    <div class="games" id="list-${svc.id}" hidden>
      ${list.map(gameBug).join("")}
      ${svc.note ? `<div class="note">${svc.note}</div>` : ""}
    </div>`;
  const head = el.querySelector(".head"), panel = el.querySelector(".games");
  head.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = el.classList.contains("open");
    closeAll();
    if (wasOpen) return;
    el.classList.add("open");
    panel.hidden = false;
    head.setAttribute("aria-expanded", "true");
    sheet.classList.add("focus");
    document.body.classList.add("focus");
  });
  el.querySelectorAll(".bug").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const inj = document.getElementById(b.getAttribute("aria-controls"));
    const open = inj.hidden;
    inj.hidden = !open;
    b.parentElement.classList.toggle("open", open);
    b.setAttribute("aria-expanded", String(open));
  }));
  el.addEventListener("click", e => e.stopPropagation());
  wrap.appendChild(el);
}

// Tapping anywhere outside the open service closes it.
document.addEventListener("click", () => { if (sheet.classList.contains("focus")) closeAll(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

if (!shown.length) {
  const next = games.find(g => g.day > today);
  wrap.innerHTML = `<div class="empty"><div class="big">No games tonight</div>
    <p>${next ? `Next up: <strong>${esc(dayLabel(next.day, { weekday: "short", month: "short", day: "numeric" }))}, ${esc(next.away)} @ ${esc(next.home)}, ${timeET(next.start)}</strong>` : "Check back tomorrow."}</p></div>`;
}

const updated = DATA && DATA.updated ? new Date(DATA.updated) : null;
const lastDay = games.length ? games[games.length - 1].day : null;
document.getElementById("foot").textContent =
  (lastDay && today > lastDay ? "This schedule is out of date. " : "") +
  "Times are Eastern. " +
  (updated ? `Updated ${updated.toLocaleString("en-US", { timeZone: tz, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}.` : "");
</script>

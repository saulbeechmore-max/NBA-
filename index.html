<title>NBA Tonight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column; four service rows that open in place to show tonight's games. */
:root {
  --bg: #f3f4f7;
  --card: #ffffff;
  --fg: #151923;
  --muted: #5d6577;
  --line: #dfe2ea;
  --prime: #0a7fd9;
  --peacock: #6d4ae0;
  --espn: #d42a2a;
  --lp: #1d4f9c;
  --live: #0f9d58;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131a; --card: #191d27; --fg: #eef0f5; --muted: #9aa2b4; --line: #2a303d;
    --prime: #3ea6ff; --peacock: #9d83ff; --espn: #ff5d5d; --lp: #6f9dff; --live: #35c97f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131a; --card: #191d27; --fg: #eef0f5; --muted: #9aa2b4; --line: #2a303d;
  --prime: #3ea6ff; --peacock: #9d83ff; --espn: #ff5d5d; --lp: #6f9dff; --live: #35c97f;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
main { max-width: 520px; margin: 0 auto; display: grid; gap: 20px; }
header h1 {
  font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1;
  margin: 0; letter-spacing: .01em; text-transform: uppercase;
}
header p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
.services { display: grid; gap: 10px; }
.svc {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
}
.svc > button {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
  display: grid; grid-template-columns: 6px 1fr auto auto; align-items: center; gap: 14px;
  padding: 16px 16px 16px 0; min-height: 76px;
}
.svc > button:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; border-radius: 14px; }
.bar { align-self: stretch; background: var(--c); }
.name { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; }
.sub { display: block; font-family: var(--body); font-weight: 400; font-size: .85rem; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 2px; }
.count { font-family: var(--display); font-weight: 700; font-size: 2rem; color: var(--c); font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: right; }
.count.zero { color: var(--muted); opacity: .6; }
.chev { width: 20px; height: 20px; color: var(--muted); transition: transform .2s; }
.svc.open .chev { transform: rotate(180deg); }
.games[hidden] { display: none; }
.games { border-top: 1px solid var(--line); padding: 4px 16px 8px 22px; display: grid; }
.game { display: grid; grid-template-columns: 5.2rem 1fr; gap: 12px; align-items: baseline; padding: 12px 0; }
.game + .game { border-top: 1px solid var(--line); }
.time { font-family: var(--display); font-weight: 600; font-size: 1.2rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.teams { font-weight: 600; font-size: 1.02rem; min-width: 0; }
.teams .at { color: var(--muted); font-weight: 400; margin: 0 .3em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.tag.live { color: var(--live); border-color: var(--live); }
.game.done { opacity: .5; }
.game > button { all: unset; box-sizing: border-box; cursor: pointer; display: contents; }
.game > button:focus-visible .teams { outline: 2px solid var(--c); outline-offset: 3px; border-radius: 4px; }
.avail { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.avail svg { width: 14px; height: 14px; transition: transform .2s; }
.game.open .avail svg { transform: rotate(180deg); }
.roster { grid-column: 2; display: grid; gap: 8px; margin-top: 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: .82rem; line-height: 1.45; }
.roster[hidden] { display: none; }
.roster b { font-weight: 600; }
.roster .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }
.roster .outs { color: var(--muted); }
.roster .src { color: var(--muted); font-size: .72rem; }
.empty { padding: 14px 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
.empty strong { color: var(--fg); font-weight: 600; }
.note { color: var(--muted); font-size: .8rem; line-height: 1.5; padding: 0 0 10px; }
footer { color: var(--muted); font-size: .8rem; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .chev, .avail svg { transition: none; } }
</style>

<main>
  <header>
    <h1>NBA Tonight</h1>
    <p id="date"></p>
  </header>
  <section class="services" id="services"></section>
  <footer id="foot"></footer>
</main>

const SERVICES = [
  { id: "prime", name: "Prime Video", sub: "Thursdays, Friday doubleheaders", color: "--prime", url: "https://www.amazon.com/primevideo" },
  { id: "peacock", name: "Peacock", sub: "Mondays and NBC Tuesdays", color: "--peacock", url: "https://www.peacocktv.com" },
  { id: "espn", name: "ESPN", sub: "ESPN and ABC games", color: "--espn" },
  { id: "leaguepass", name: "League Pass", sub: "Every other game", color: "--lp",
    note: "Games involving your local team are blacked out on League Pass." },
];

const tz = "America/New_York";
const dayKey = d => new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const timeET = iso => new Date(iso).toLocaleTimeString("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" });
const dayLabel = (key, opts) => new Date(key + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...opts });

const now = new Date();
const today = dayKey(now);
const games = (DATA && DATA.games) || [];
const tonight = games.filter(g => g.day === today);

document.getElementById("date").textContent =
  dayLabel(today, { weekday: "long", month: "long", day: "numeric" }) + " · " +
  (tonight.length ? `${tonight.length} game${tonight.length === 1 ? "" : "s"} tonight` : "No games tonight");

function state(g) {
  const start = new Date(g.start).getTime(), t = now.getTime();
  if (t >= start + 3 * 3600e3) return "done";
  if (t >= start) return "live";
  return "";
}

const TEAMS = (DATA && DATA.teams) || {};
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const CHEV = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>`;
let rowId = 0;

function teamLine(name, t) {
  if (!t) return `<div><b>${esc(name)}</b> <span class="cnt">roster not available</span></div>`;
  const active = t.roster - t.out.length;
  return `<div><b>${esc(name)}</b> <span class="cnt">${active} of ${t.roster} active</span>
    <div class="outs">${t.out.length ? t.out.map(n => esc(n) + " out").join(", ") : "Nobody out"}</div></div>`;
}

function gameRow(g) {
  const s = state(g);
  const id = "g" + (rowId++);
  const a = TEAMS[g.awayId], h = TEAMS[g.homeId];
  const tags = [];
  if (s === "live") tags.push(`<span class="tag live">Live now</span>`);
  if (g.channel && !["Prime Video", "Peacock"].includes(g.channel)) tags.push(`<span class="tag">${esc(g.channel)}</span>`);
  if (g.cup) tags.push(`<span class="tag">NBA Cup</span>`);
  const outCount = (a ? a.out.length : 0) + (h ? h.out.length : 0);
  const summary = (a && h) ? `${outCount} player${outCount === 1 ? "" : "s"} out` : "Injury report";
  return `<div class="game ${s === "done" ? "done" : ""}">
    <button type="button" aria-expanded="false" aria-controls="${id}">
      <div class="time">${timeET(g.start)}</div>
      <div class="teams">${esc(g.away)}<span class="at">@</span>${esc(g.home)}

        <div class="avail">${summary} ${CHEV}</div></div>
    </button>
    <div class="roster" id="${id}" hidden>
      ${teamLine(g.away, a)}
      ${teamLine(g.home, h)}
      <div class="src">Players out, highest paid first.</div>
    </div>
  </div>`;
}

function emptyText(svc) {
  const next = games.find(g => g.service === svc.id && g.day > today);
  if (!next) return `No ${svc.name} games tonight or in the next week.`;
  return `No ${svc.name} games tonight.<br>Next: <strong>${dayLabel(next.day, { weekday: "short", month: "short", day: "numeric" })}, ${next.away} @ ${next.home}, ${timeET(next.start)}</strong>`;
}

const wrap = document.getElementById("services");
for (const svc of SERVICES) {
  const list = tonight.filter(g => g.service === svc.id);
  const el = document.createElement("div");
  el.className = "svc";
  el.style.setProperty("--c", `var(${svc.color})`);
  el.innerHTML = `
    <button type="button" id="btn-${svc.id}" aria-expanded="false" aria-controls="list-${svc.id}">
      <span class="bar"></span>
      <span class="name">${svc.name}<span class="sub">${svc.sub}</span></span>
      <span class="count ${list.length ? "" : "zero"}" aria-label="${list.length} games tonight">${list.length}</span>
      <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
    </button>
    <div class="games" id="list-${svc.id}" hidden>
      ${list.length ? list.map(gameRow).join("") : `<div class="empty">${emptyText(svc)}</div>`}
      ${svc.note && list.length ? `<div class="note">${svc.note}</div>` : ""}
    </div>`;
  const btn = el.querySelector("button"), panel = el.querySelector(".games");
  btn.addEventListener("click", () => {
    const open = panel.hidden;
    panel.hidden = !open;
    el.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  });
  el.querySelectorAll(".game > button").forEach(b => b.addEventListener("click", () => {
    const panel = document.getElementById(b.getAttribute("aria-controls"));
    const open = panel.hidden;
    panel.hidden = !open;
    b.parentElement.classList.toggle("open", open);
    b.setAttribute("aria-expanded", String(open));
  }));
  wrap.appendChild(el);
}

const updated = DATA && DATA.updated ? new Date(DATA.updated) : null;
const lastDay = games.length ? games[games.length - 1].day : null;
document.getElementById("foot").textContent =
  (lastDay && today > lastDay ? "This schedule is out of date. " : "") +
  "Times are Eastern. " +
  (updated ? `Schedule updated ${updated.toLocaleDateString("en-US", { timeZone: tz, month: "short", day: "numeric" })}.` : "");
</script>
